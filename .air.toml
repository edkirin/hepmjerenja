root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./main-dev"
cmd = "templ generate ./app/templates/ && go build -o ./main-dev ./app/."
delay = 500
exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "testdata",
    "build",
    "migrations",
    "cert",
    "http-requests",
    "app/docs",
]
exclude_file = []
exclude_regex = ["_test.go", "_templ.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "tpl", "tmpl", "templ", "html"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
